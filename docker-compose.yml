# VitaLink — local development services.
# Values come from .env (copy .env.example to .env first).
#
#   docker compose up -d      start
#   docker compose ps         status
#   docker compose logs -f    follow logs
#   docker compose down       stop (data survives in the named volume)
#   docker compose down -v    stop AND delete the data

services:
  postgres:
    image: postgres:16-alpine
    container_name: vitalink-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container — change the host side in .env if 5432 is taken
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vitalink-pgdata:/var/lib/postgresql/data
    healthcheck:
      # lets other services (and you) know when Postgres is actually ready,
      # not merely started — the container accepts connections a moment later
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  vitalink-pgdata:
    name: vitalink-pgdata
