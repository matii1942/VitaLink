# VitaLink CI — runs on every push to main and on every pull request.
#
# Two jobs, one per package, running in parallel.
#

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------
  # VitaLink itself — the NestJS API.
  # ---------------------------------------------------------------------
  api:
    name: API — lint and test
    runs-on: ubuntu-latest

    # A real PostgreSQL, started by the runner before the first step and
    # thrown away after the last one. It is not our docker-compose service:
    # GitHub starts it itself, on the same pinned image, and publishes port
    # 5432 on the runner's localhost.
    #
    # The database is called vitalink_test, and the name matters: the test
    # harness refuses to truncate a database whose name does not end in
    # _test (see test/helpers/database.ts). That is the guard that stops a
    # misconfigured DATABASE_URL from emptying a real database.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vitalink
          POSTGRES_PASSWORD: vitalink_ci
          POSTGRES_DB: vitalink_test
        ports:
          - 5432:5432
        # Without this the steps would start while PostgreSQL is still
        # initialising and the first query would be refused. pg_isready is
        # the same check docker-compose.yml uses.
        options: >-
          --health-cmd "pg_isready -U vitalink -d vitalink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # The application refuses to start without these (see legacy.module.ts).
    # DATABASE_URL now points at a database that really exists. Nothing in
    # this job talks SOAP, so LEGACY_SOAP_URL only has to be well-formed.
    env:
      DATABASE_URL: postgresql://vitalink:vitalink_ci@localhost:5432/vitalink_test?schema=public
      LEGACY_SOAP_URL: http://localhost:8080/hospital?wsdl

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The version lives in .nvmrc, at the repository root, and nowhere
          # else. Whoever changes it changes it for every machine that runs
          # this code: this runner, the developer's, and the Docker image.
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      # npm ci is the CI-specific install: it installs exactly what the
      # lockfile says and fails if package.json and the lockfile disagree.
      # npm install would silently "fix" the mismatch, which hides bugs.
      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code: it lives in src/generated/,
      # which is git-ignored, so a clean checkout does not have it. It has to
      # be rebuilt from the schema before anything that imports it can
      # compile. Needs no database.
      - name: Generate the Prisma client
        run: npx prisma generate

      # Creates the tables in the service container above. The test harness
      # does this too, so this step is not strictly required — it is here so
      # that a broken migration fails in a step called "migrations" instead
      # of somewhere inside a test run.
      - name: Apply the migrations
        run: npx prisma migrate deploy

      - name: Lint
        run: npm run lint

      - name: Test (unit)
        run: npm test

      # The e2e suite boots the real Nest application, drives it over HTTP and
      # reads and writes the real database. It lives in its own Vitest config
      # because it matches *.e2e-spec.ts, which `npm test` deliberately skips
      # — so CI has to call it explicitly.
      - name: Test (e2e)
        run: npm run test:e2e

  # ---------------------------------------------------------------------
  # The simulated hospital. A separate job because it is a separate package
  # with its own dependencies; the two run in parallel.
  # ---------------------------------------------------------------------
  legacy-sim:
    name: Hospital simulator — test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/legacy-sim

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # The version lives in .nvmrc, at the repository root, and nowhere
          # else. Whoever changes it changes it for every machine that runs
          # this code: this runner, the developer's, and the Docker image.
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: apps/legacy-sim/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Includes a test that starts the SOAP server on a random port and
      # calls it with a real SOAP client.
      - name: Test
        run: npm test

      # Proves the image builds from a clean checkout — the step that would
      # have caught the missing dependencies in package.json.
      - name: Build the Docker image
        working-directory: .
        run: docker build -t vitalink-legacy-sim apps/legacy-sim
