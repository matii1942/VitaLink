# VitaLink CI — runs on every push to main and on every pull request.
#
# Sprint 0 scope: install, lint, test.
# Sprint 3 will add a PostgreSQL service container for integration tests.
#
# If your API does not live at apps/api, change the two `working-directory`
# values and `cache-dependency-path` to match.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      # npm ci is the CI-specific install: it installs exactly what the
      # lockfile says and fails if package.json and the lockfile disagree.
      # npm install would silently "fix" the mismatch, which hides bugs.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (unit)
        run: npm test

      # The e2e suite boots the real Nest application and drives it over HTTP.
      # It lives in its own Vitest config because it matches *.e2e-spec.ts,
      # which `npm test` deliberately skips — so CI has to call it explicitly.
      - name: Test (e2e)
        run: npm run test:e2e
