# VitaLink CI — runs on every push to main and on every pull request.
#
# Two jobs, one per package, running in parallel.
# Sprint 3 will add a PostgreSQL service container for integration tests.
#

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # ---------------------------------------------------------------------
  # VitaLink itself — the NestJS API.
  # ---------------------------------------------------------------------
  api:
    name: API — lint and test
    runs-on: ubuntu-latest

    # The application refuses to start without these (see legacy.module.ts).
    # Nothing in this job connects to either address: the database pool and
    # the SOAP client both open on first use, and no test here uses them. They
    # only have to be present and well-formed. Sprint 3 replaces them with a
    # real PostgreSQL service container for integration tests.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
      LEGACY_SOAP_URL: http://localhost:8080/hospital?wsdl

    defaults:
      run:
        working-directory: apps/api

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      # npm ci is the CI-specific install: it installs exactly what the
      # lockfile says and fails if package.json and the lockfile disagree.
      # npm install would silently "fix" the mismatch, which hides bugs.
      - name: Install dependencies
        run: npm ci

      # The Prisma client is generated code: it lives in src/generated/,
      # which is git-ignored, so a clean checkout does not have it. It has to
      # be rebuilt from the schema before anything that imports it can
      # compile. Needs no database.
      - name: Generate the Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test (unit)
        run: npm test

      # The e2e suite boots the real Nest application and drives it over HTTP.
      # It lives in its own Vitest config because it matches *.e2e-spec.ts,
      # which `npm test` deliberately skips — so CI has to call it explicitly.
      - name: Test (e2e)
        run: npm run test:e2e

  # ---------------------------------------------------------------------
  # The simulated hospital. A separate job because it is a separate package
  # with its own dependencies; the two run in parallel.
  # ---------------------------------------------------------------------
  legacy-sim:
    name: Hospital simulator — test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/legacy-sim

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: apps/legacy-sim/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Includes a test that starts the SOAP server on a random port and
      # calls it with a real SOAP client.
      - name: Test
        run: npm test

      # Proves the image builds from a clean checkout — the step that would
      # have caught the missing dependencies in package.json.
      - name: Build the Docker image
        working-directory: .
        run: docker build -t vitalink-legacy-sim apps/legacy-sim
