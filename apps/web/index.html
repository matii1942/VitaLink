<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Inlined as a data URI rather than a file: one fewer request, and no
      404 in the console of a static build served from a folder.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%230b0b0b'/%3E%3Cpath d='M4 17h5l3-7 4 14 3-9 2 2h7' fill='none' stroke='%230ca30c' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>VitaLink — ward board</title>
  </head>
  <body>
    <!--
      The only element the page starts with. Everything a nurse sees is put
      inside it by JavaScript at run time; the file the browser downloads is
      this, and it is empty.

      That is the trade a single-page application makes. Navigation is
      instant because nothing is fetched again, and the first paint waits for
      a script. For an internal tool on a hospital network that is the right
      side of the trade; for a public page that must appear in a search
      engine it would not be.
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
